<!doctype html>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#000; color:#fff; position:relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:72px 80px;
  }
  .rule { position:absolute; left:0; top:0; width:100%; height:8px; background:#d10000; }
  .eyebrow { font-size:24px; letter-spacing:.18em; text-transform:uppercase;
             color:#d10000; font-weight:600; }
  h1 { font-size:76px; line-height:1.06; font-weight:700; letter-spacing:-.02em;
       max-width:960px; }
  .foot { display:flex; align-items:center; justify-content:space-between; }
  .word { font-size:30px; font-weight:700; letter-spacing:.22em; }
  .mark { height:64px; opacity:.9; }
</style>
<div class="rule"></div>
<div class="eyebrow" id="eyebrow">Cardiovascular AI</div>
<h1 id="headline">Radiology. Redefined.</h1>
<div class="foot">
  <div class="word">AIATELLA</div>
  <img class="mark" id="mark" src="" alt="">
</div>
